# libcamera Android HAL configuration for the Hisense A6L (install to /vendor/etc/libcamera/camera_hal.yaml).
# Camera IDs = sensor firmware-node paths created by a6l-camera-v75.dtbo (libcamera uses the DT path as ID).
# Rotation/location from stock camera_config.xml (MountAngle) and stock DT qcom,mount-angle.
# hi846 merge (29 Sep 2026): Android camera IDs follow "order" (libcamera patch 0008; without it IDs follow the sensor
# probe order, which is not stable): 0 = rear IMX576, 1 = front S5K3T1, 2 = rear wide Hi-846. "aux: true" = the camera is
# only exposed after a non-aux camera with the same facing, so the Hi-846 can never be camera 0, the default back camera
# or the torch owner (the provider gives the torch to the first BACK camera), even if the IMX576 fails to probe.
cameras:
  "/base/soc@0/cci@ca0c000/i2c-bus@0/camera@1a":   # IMX576 rear main (+ GT9769 VCM) -> Android camera 0, torch owner
    location: back
    rotation: 90
    focal-length: 3.95
    aperture: 1.8
    order: 0
  "/base/soc@0/cci@ca0c000/i2c-bus@1/camera@2d":   # S5K3T1 front -> Android camera 1
    location: front
    rotation: 270
    focal-length: 3.2
    aperture: 2.0
    order: 1
  "/base/soc@0/cci@ca0c000/i2c-bus@1/camera@20":   # Hi-846 rear wide (aux) -> Android camera 2 (2-lane DT + s_ctrl fix, t38 PASS)
    location: back
    rotation: 90
    focal-length: 1.66
    aperture: 2.2
    order: 2
    aux: true
