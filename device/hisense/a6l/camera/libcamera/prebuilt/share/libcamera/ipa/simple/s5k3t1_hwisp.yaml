# camera-iq-20261008 V2b = V2 + the V1b changes.
# A6L hw-ISP (VFE 4.8 PIX path, round 6 = round 5 + chroma denoise + low-light frame extension): s5k3t1 = r3-A unchanged (used only if listed in persist.vendor.a6l.hwisp.sensors).
# CCM / WB gains / LUT are applied by the VFE through DebayerHwIsp; statistics come from the NV12 output
# (inverse LUT/CCM/WB; AF focus measure in the linear domain). Needs IPA be807526 (camera round 3, 0030-0035).
# Source: camera-round3-20261006/tuning/s5k3t1.r3-A.yaml
# SPDX-License-Identifier: CC0-1.0
# Hisense A6L s5k3t1 (front S5K3T1) tuning for the libcamera simple IPA (SoftISP) - camera round 3 candidate "r3-A".
# Needs: IPA be807526 (0030..0035, camera-round3-20261006/ipa/ipa-only) with the deployed libcamera.so ddae16c6. Generated by camera-round3-20261006/scripts/34-make-tuning.py (R2 values unchanged).
# Generated by camera-round2-20261006/scripts/15-make-tuning.py from decoded stock chromatix data; see README.md.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
  - Awb:
  # Stock Qualcomm AWB-driven CCMs decoded from libchromatix_s5k3t1sp_hmct_hxsef02_a3_zsl_preview.so (camera-quality-20261006).
  # Row-major, rows = output R,G,B; columns = input R,G,B; rows sum to 1 (neutral-preserving).
  # NOTE: enabling Ccm switches debayer to the slower upstream scalar CCM path (A6L NEON prefix is !ccm only).
  - Ccm:
      ccms:
        - ct: 4000   # stock TL84 (as installed in Stage B)
          ccm: [    1.7413,   -0.7515,    0.0102,
                    -0.2515,    1.5352,   -0.2837,
                     0.0201,   -0.6704,    1.6502 ]
  - Adjust:
      # Tone fitted to the decoded stock default gamma table (02/06): stock midtones are brighter and its
      # shoulder softer than gamma 2.2 + contrast 1.2. blackPoint (0032) = toe, equal on all channels after WB.
      # drcStrength (0032): give back half of any Agc highlight cut to the midtones by raising gamma.
      gamma: 3.2          # camera-iq V1b: with contrast 1.3 = mild shadow/mid lift vs V1 (0.05 -> 64 vs 55, 0.18 -> 122 vs 115)
      contrast: 1.3       # camera-iq V1b (V1 1.4): softer shoulder too (0.7 -> 236 vs 240)
      blackPoint: 0.0     # camera-iq V1: DebayerHwIsp applies blackLevel.r() to ALL channels pre-WB -> B crushed under warm light
      drcStrength: 0.0    # camera-iq V1: the VFE LUT is only reloaded at the next stream start -> keep it constant
      drcPivot: 0.18
      # Round 6 (0037 keys, camera round 3 r3-B values): NV12 chroma denoise, applied by DebayerHwIsp while it copies
      # the CbCr plane from the VFE buffer (no extra pass); stronger at high gain, the limit protects colour edges.
      chromaDenoise: 0.7
      chromaDenoiseHighGain: 1.0
      chromaDenoiseLimit: 6
      chromaDenoiseLimitHighGain: 12
      chromaDenoiseGainStart: 2.0
      chromaDenoiseGainEnd: 8.0
  - Agc:
      # 0031. target = stock luma target 60/255 x missing-LSC frame-mean factor 1.605
      # x 0.74 (matched front pair, subject patches): 0.279.
      # Installed IPA: fixed 0.4 (= +0.51 EV brighter than this).
      target: 0.28
      lowLightTarget: 0.196   # stock low-light zone ratio 0.70
      lowLightGainStart: 4.0
      lowLightGainEnd: 8.0
      # keep the brightest 2 % below 90 % of the white-balanced clip level, at most 1 EV under target
      highlightQuantile: 0.98
      highlightTarget: 0.9
      highlightMaxCut: 0.5    # camera-iq V1b (was 1.0; DRC is off): bright monitor/window darkens the scene at most 0.5 EV
      # Round 3 (0035): faster convergence that stays stable even if a decision sees the previous exposure
      # (offline model rerun/agc-sim-stdout.txt, 'mild'). Deployed: convergence 0.5, maxStep 1.5, no split.
      convergence: 0.6
      maxStep: 2.0
      splitExposureGain: true
      # Round 6 (0038, needs core 0102): low light, lengthen the frame (VBLANK) instead of adding gain once the
      # gain at the 30 fps exposure reaches frameExtensionGain; at most maxFrameDuration (15 fps, like stock
      # preview). Bright and normal indoor scenes stay at 30 fps. persist.vendor.a6l.hwisp.minfps=30 disables it.
      maxFrameDuration: 66667
      frameExtensionGain: 4.0
...
