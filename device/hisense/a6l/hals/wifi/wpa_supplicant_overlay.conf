# A6L: ath10k (mainline, nl80211). Loaded after /vendor/etc/wifi/wpa_supplicant.conf template by the supplicant HAL.
p2p_no_group_iface=1
# wifi-20261008 suspend: keep the association through system suspend (stock behaviour) instead of the mac80211
# no-WoWLAN path (deauth + vdev delete + pdev suspend + QMI wlan off), which crashed the WCN3990 WLAN PD on the modem
# (round 15: err_qdi EX:wlan_process -> MSS fatal). wpa_supplicant sends NL80211_CMD_SET_WOWLAN when it adds wlan0;
# ath10k (fw features: wowlan) then suspends with WMI WOW_ENABLE + CE wake IRQ. ath10k supports disconnect/magic_pkt.
wowlan_triggers=disconnect magic_pkt
