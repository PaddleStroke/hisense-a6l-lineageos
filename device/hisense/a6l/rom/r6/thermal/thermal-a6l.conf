# A6L thermal HAL sensors (r6 prep, 29 Sep 2026; thermal-r5prep review same day, docs/android-thermal-20260929.md).
# Zone types checked against the BUILT r5 DTB (/home/a6l/rom-v2/kit-r5/rom-v2.dts, thermal-zones): aoss, cpuss0/1, cpu0-3,
# pwr-cluster, gpu (tsens hw ids 0..8), pm660, pm660l (spmi-temp-alarm); "-thermal" suffix tolerated. Battery = qcom-battery
# power_supply (pmi8998_fg, 0.1 degC; also a tripless thermal zone of the same name).
# tsens ids vs stock thermal-engine.conf aliases: 1,2 = silver cluster (stock VIRTUAL-CLUSTER0), 3..6 = the four gold cores
# (stock "cpu4..7"; mainline calls these zones cpu0..3), 7 = gold L2/pwr-cluster, 8 = gpu (stock SS-GPU 95 degC).
# thermal follow-up (29 Sep 2026, docs/android-thermal-cooling-20260929.md): CPU SHUTDOWN 107 / GPU 105 = Android
# ThermalManagerService clean shutdown (CPU/GPU/SKIN/BATTERY types) BEFORE the kernel critical trips (110): no
# cpufreq cooling yet, and on the r5 kernel a critical trip does not power off (STATIC_USERMODEHELPER "", DELAY_MS=0).
# Thresholds LIGHT MODERATE SEVERE CRITICAL EMERGENCY SHUTDOWN in degC ('-' = unset). The kernel's own DT trips stay in force
# (cpu passive 70 [no cooling-map in r5!] / critical 110, gpu passive 85 [-> gpu devfreq] / 90 / 110, pm660(l) 95 / 125):
# these values drive Android's thermal status (throttling hints, warnings, thermal shutdown).
# Source alternatives: 'a|b' = first one present wins; '@<scale>' after a source overrides the scale column.
# name        type     source                                                        scale  LIGHT MOD  SEV  CRIT EMERG SHUT
cpu0          CPU      zone:cpu0-thermal                                             0.001  85    90   95   100  105   107
cpu1          CPU      zone:cpu1-thermal                                             0.001  85    90   95   100  105   107
cpu2          CPU      zone:cpu2-thermal                                             0.001  85    90   95   100  105   107
cpu3          CPU      zone:cpu3-thermal                                             0.001  85    90   95   100  105   107
cpuss0        CPU      zone:cpuss0-thermal                                           0.001  85    90   95   100  105   107
cpuss1        CPU      zone:cpuss1-thermal                                           0.001  85    90   95   100  105   107
gpu           GPU      zone:gpu-thermal                                              0.001  80    85   90   95   100   105
soc           SOC      zone:aoss-thermal                                             0.001  -     -    -    -    -     -
pwr-cluster   SOC      zone:pwr-cluster-thermal                                      0.001  -     -    -    -    -     -
# PMIC die temperature (qcom-spmi-temp-alarm). pm660's node takes io-channels = pm660_adc die_temp: its zone only appears
# once qcom-spmi-adc5.ko is loaded (NOT in the r5 module lists -> probe deferred). pm660l has no ADC link.
pm660         SOC      zone:pm660-thermal                                            0.001  -     -    95   105  115   -
pm660l        SOC      zone:pm660l-thermal                                           0.001  -     -    95   105  115   -
battery       BATTERY  file:/sys/class/power_supply/qcom-battery/temp 0.1               42    44   45   50   55    60
# Skin: stock uses the PM660 VADC thermistor quiet_therm (AMUX_THM5, channel 0x51, label in the r5 DT) for every skin
# decision: gold throttling 45, silver/GPU 47, charging steps 36/39/42/46 (BATTERY_CHARGING_CTL). Read over IIO
# (qcom-spmi-adc5, in_temp_quiet_therm_input, millidegC). Until that module loads, the battery temperature is the proxy.
# Android's thermal status / headroom API reads SKIN sensors only.
skin          SKIN     iio:quiet_therm@0.001|file:/sys/class/power_supply/qcom-battery/temp 0.1 41 45 47 50 53 58
# Informational board thermistors (same PM660 VADC, stock names), no thresholds. Channel 0x50 is "epd_therm" (e-ink panel)
# in stock (vadc chan@50) and "pa_therm1" in the r5 DT (mainline pm660.dtsi label): both accepted.
xo-therm      SOC      iio:xo_therm                                                  0.001  -     -    -    -    -     -
msm-therm     SOC      iio:msm_therm                                                 0.001  -     -    -    -    -     -
emmc-therm    SOC      iio:emmc_therm                                                0.001  -     -    -    -    -     -
pa-therm0     POWER_AMPLIFIER iio:pa_therm0                                          0.001  -     -    -    -    -     -
epd-therm     SOC      iio:epd_therm|iio:pa_therm1                            0.001  -     -    -    -    -     -
