# A6L skin mitigation (thermal-20261012, firmware/extracted/thermal-20261012/README.md): the stock thermal-engine "ss"
# sections (firmware/extracted/vendor/etc/thermal-engine.conf), applied by the thermal HAL every 2 s (stock sampling 2000 ms)
# on the userspace max-frequency knobs: cpufreq policyN/scaling_max_freq (kHz) and devfreq max_freq (Hz).
# sensor = a sensor name of thermal-a6l.conf ("skin" = PM660 quiet_therm, the battery temperature until adc5 loads).
# device: cpu-big (policy with the highest cpuinfo_max_freq = gold, policy1 on the A6L) | cpu-little (silver, policy0) |
#         cpu:policyN | gpu (devfreq 5000000.gpu) | devfreq:<name>
# set/clear = stock set_point/set_point_clr. max_limit = stock device_max_limit = the first cap when set is crossed; while
# the sensor stays above set and keeps heating the cap goes down one table step at a time (>= 6 s apart) to the floor;
# below set it comes back up, at most to max_limit, and the cap is released at clear (as stock).
# floor: stock ss has none (it walks down to the lowest step). A6L floors keep the camera pipeline and the UI usable
# (gold/silver 1113.6 MHz, GPU 370 MHz); if the skin still rises the Android status (thermal-a6l.conf skin MODERATE 48)
# warns, and CRITICAL/EMERGENCY/SHUTDOWN stay as before.
# Tables: gold 300000 1113600 1401600 1747200 1958400 2150400 2208000; silver 300000 633600 902400 1113600 1401600 1536000
# 1747200 1843200 (a6l_cpufreq_osm, firmware/extracted/cpufreq-20261007/phone-rev11-full.txt); GPU 160/266/370/465/588/647 MHz
# (sdm660.dtsi, bin dependent up to 750).
# name                 sensor device      set  clear max_limit  floor
SS-QUIET-THERM-GOLD    skin   cpu-big     45   40    1747200    1113600
SS-QUIET-THERM-SILVER  skin   cpu-little  47   40    1536000    1113600
SS-QUIET-THERM-GPU     skin   gpu         47   40    588000000  370000000
# stock SS-GPU (tsens gpu 95/65 -> 588 MHz). The kernel's gpu-thermal passive 85 C devfreq cooling acts first; kept for parity.
SS-GPU                 gpu    gpu         95   65    588000000  370000000
