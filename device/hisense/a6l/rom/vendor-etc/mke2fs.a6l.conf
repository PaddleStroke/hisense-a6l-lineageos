# A6L r6c (30 Sep 2026, docs/rom-r6c-20260930.md): mke2fs profile for the first-boot formats done by fs_mgr under
# mount_all (userdata ~107 GiB, metadata 10 MiB). init.qcom.rc exports MKE2FS_CONFIG=/vendor/etc/mke2fs.a6l.conf around
# mount_all only. = the platform /system/etc/mke2fs.conf (external/e2fsprogs, Lineage 24 build) + `discard = false`:
# mke2fs otherwise discards the whole device before writing the filesystem (r6b: 28.5 s for userdata, blocking init).
# Free space is still trimmed later by Android's idle maintenance (fstrim), and the `discard` mount option (as stock) trims
# on delete.
[defaults]
    base_features = sparse_super,large_file,filetype,dir_index,ext_attr
    default_mntopts = acl,user_xattr
    enable_periodic_fsck = 0
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    reserved_ratio = 1.0
    discard = false

[fs_types]
    ext3 = {
        features = has_journal
    }
    ext4 = {
        features = has_journal,extent,huge_file,dir_nlink,extra_isize,uninit_bg
        inode_size = 256
    }
    ext4dev = {
        features = has_journal,extent,huge_file,flex_bg,inline_data,64bit,dir_nlink,extra_isize
        inode_size = 256
        options = test_fs=1
    }
    small = {
        blocksize = 1024
        inode_size = 128
        inode_ratio = 4096
    }
    floppy = {
        blocksize = 1024
        inode_size = 128
        inode_ratio = 8192
    }
    big = {
        inode_ratio = 32768
    }
    huge = {
        inode_ratio = 65536
    }
    news = {
        inode_ratio = 4096
    }
    largefile = {
        inode_ratio = 1048576
        blocksize = -1
    }
    largefile4 = {
        inode_ratio = 4194304
        blocksize = -1
    }
    hurd = {
         blocksize = 4096
         inode_size = 128
    }
